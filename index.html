<!DOCTYPE html>
<html>
<head>
    <title></title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <video id="video" preload="auto">
        <source src="HEYYEYAAEYAAAEYAEYAA.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById("video");

        document.addEventListener("click", async () => {
            try {
                await document.documentElement.requestFullscreen();
            } catch (error) {
                console.log("Fullscreen unavailable:", error);
            }

            video.muted = false;
            video.play();
        }, { once: true });
    </script>

</body>
</html>
